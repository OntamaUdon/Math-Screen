# push のたびに、署名なしでシミュレータ向けにビルドしてコンパイルエラーがないか確認する。
name: Build check

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify problem answers
        run: |
          python -m pip install --quiet sympy matplotlib
          python tools/build_problems.py
          git diff --exit-code -- mathscreen/Resources/problems.json mathscreen/Resources/units.json preview/problems.js
          python tools/audit_problems.py        # 三角形が成り立たない、など、問題として成り立たない条件がないか

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (simulator, unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project mathscreen.xcodeproj \
            -scheme mathscreen \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO | tee build.log | grep -E "error:|warning: .*\.swift|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log
