# Android 版（android/ フォルダ）のビルド。iPhone 版のワークフローとは別のもの。
# push のたびに、デバッグ版の APK を作って、Actions の画面からダウンロードできるようにする。
# コミットメッセージに [android-shots] を含めると、エミュレーターで起動して、画面のスクリーンショットも撮る。
name: Android

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
      - "mathscreen/Resources/problems.json"
      - "mathscreen/Resources/units.json"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          # このブランチでも、ダウンロードした部品をとっておく（GitHub 側の一時的な通信エラーで失敗しにくくする）
          cache-read-only: false

      - name: Build (debug APK)
        run: ./gradlew --no-daemon assembleDebug || (sleep 30 && ./gradlew --no-daemon assembleDebug)

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest || (sleep 30 && ./gradlew --no-daemon testDebugUnitTest)

      - name: Lint（問題がありそうな書き方を探す。結果はログに出す）
        continue-on-error: true
        run: |
          ./gradlew --no-daemon lintDebug || true
          python3 - <<'PY'
          import xml.etree.ElementTree as ET, glob
          for f in glob.glob("app/build/reports/lint-results-debug.xml"):
              for i in ET.parse(f).getroot().iter("issue"):
                  if i.get("severity") in ("Error", "Fatal", "Warning"):
                      loc = i.find("location")
                      where = (loc.get("file", "").split("/app/src/")[-1] + ":" + loc.get("line", "")) if loc is not None else ""
                      print(f"LINT {i.get('severity')} {i.get('id')} {where} {i.get('message')}")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: qlock-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

  screenshots:
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[android-shots]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          # このブランチでも、ダウンロードした部品をとっておく（GitHub 側の一時的な通信エラーで失敗しにくくする）
          cache-read-only: false

      - name: Build (debug APK)
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug || (sleep 30 && ./gradlew --no-daemon assembleDebug)

      - name: Enable KVM (emulator speed)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on emulator and take screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash android/tools/screenshots.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qlock-android-screenshots
          path: android/build-screenshots/
          retention-days: 14

  # ロックの動きを、エミュレーターで自動で確かめる。コミットメッセージに [android-e2e] を含めるか、手動で実行する。
  e2e:
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[android-e2e]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          # このブランチでも、ダウンロードした部品をとっておく（GitHub 側の一時的な通信エラーで失敗しにくくする）
          cache-read-only: false

      - name: Build (debug APK)
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug || (sleep 30 && ./gradlew --no-daemon assembleDebug)

      - name: Enable KVM (emulator speed)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Lock flow on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash android/tools/e2e.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qlock-android-e2e
          path: android/build-e2e/
          retention-days: 14

  # リリース版（Google Play に送る .aab）。コミットメッセージに [android-release] を含めるか、手動で実行する。
  # アップロード用の鍵は、GitHub の Secrets から読む（docs/PLAY_SETUP.md の 3）。鍵がなければ、このジョブは止まる。
  release:
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[android-release]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: android
    env:
      KEYSTORE_B64: ${{ secrets.QLOCK_KEYSTORE_BASE64 }}
      QLOCK_KEYSTORE_PASSWORD: ${{ secrets.QLOCK_KEYSTORE_PASSWORD }}
      QLOCK_KEY_ALIAS: ${{ secrets.QLOCK_KEY_ALIAS }}
      QLOCK_KEY_PASSWORD: ${{ secrets.QLOCK_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          # このブランチでも、ダウンロードした部品をとっておく（GitHub 側の一時的な通信エラーで失敗しにくくする）
          cache-read-only: false

      - name: Restore upload key
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "QLOCK_KEYSTORE_BASE64 が Secrets にありません"; exit 1; fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "QLOCK_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Build (release .aab)
        run: ./gradlew --no-daemon bundleRelease -PversionCode=${{ github.run_number }}

      - name: Remove upload key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: qlock-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 30
