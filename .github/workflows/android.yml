# Android 版（android/ フォルダ）のビルド。iPhone 版のワークフローとは別のもの。
# push のたびに、デバッグ版の APK を作って、Actions の画面からダウンロードできるようにする。
# コミットメッセージに [android-shots] を含めると、エミュレーターで起動して、画面のスクリーンショットも撮る。
name: Android

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
      - "mathscreen/Resources/problems.json"
      - "mathscreen/Resources/units.json"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build (debug APK)
        run: ./gradlew --no-daemon assembleDebug

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - uses: actions/upload-artifact@v4
        with:
          name: qlock-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

  screenshots:
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[android-shots]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build (debug APK)
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Enable KVM (emulator speed)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on emulator and take screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash android/tools/screenshots.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qlock-android-screenshots
          path: android/build-screenshots/
          retention-days: 14
