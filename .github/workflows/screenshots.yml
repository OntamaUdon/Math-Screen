# コミットメッセージに [screenshots] を含めて push すると、シミュレータでアプリを動かして、
# App Store 審査用のスクリーンショット（購入の画面）を撮り、store/screenshots/ にコミットする。
name: Screenshots

on:
  push:
    branches: ["claude/**"]

permissions:
  contents: write

jobs:
  screenshots:
    if: ${{ contains(github.event.head_commit.message, '[screenshots]') }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen & generate project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Pick a simulator (iPhone Pro Max, 6.9 inch)
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          c=[x for k,v in d.items() if 'iOS' in k for x in v if 'Pro Max' in x['name']]
          print(c[-1]['udid'])")
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl list devices available | grep "$UDID" || true
      - name: Boot and build
        run: |
          set -o pipefail
          xcrun simctl boot "$UDID"
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularMode active --cellularBars 4 --wifiBars 3 || true
          xcodebuild build -project mathscreen.xcodeproj -scheme mathscreen -configuration Debug \
            -destination "id=$UDID" -derivedDataPath build/dd CODE_SIGNING_ALLOWED=NO | tail -5
      - name: Launch and capture
        run: |
          APP=$(find build/dd -name "mathscreen.app" -path "*Debug-iphonesimulator*" | head -1)
          echo "app: $APP"
          xcrun simctl install "$UDID" "$APP"
          mkdir -p store/screenshots
          for scene in home book solve stats plan; do
            xcrun simctl terminate "$UDID" com.ontamaudon.qlock 2>/dev/null || true
            xcrun simctl launch "$UDID" com.ontamaudon.qlock -screenshot "$scene"
            sleep 10
            xcrun simctl io "$UDID" screenshot "store/screenshots/$scene.png"
            sips -g pixelWidth -g pixelHeight "store/screenshots/$scene.png" | tail -2
          done
      - name: Commit the images
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add store/screenshots
          git commit -m "審査用のスクリーンショットを撮る [skip ci]" || exit 0
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
