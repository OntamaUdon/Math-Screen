# 手動実行（Actions タブ → TestFlight → Run workflow）で、ビルドして TestFlight にアップロードする。
# 必要な Secrets は docs/SETUP.md を参照。
name: TestFlight

on:
  # タグ「testflight-*」を push しても実行できる（標準ブランチに無くても動く）。
  # タグ名に ui-only を含めると、スクリーンタイム機能(Family Controls)を外した版になる。例: testflight-ui-only-1
  push:
    tags: ["testflight-*"]
  workflow_dispatch:
    inputs:
      screen_time:
        description: "スクリーンタイム機能(Family Controls)を含める。Apple の配布用許可が下りるまでは false でUIだけ確認"
        type: boolean
        default: true

jobs:
  testflight:
    runs-on: macos-15
    env:
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        run: |
          for v in TEAM_ID ASC_KEY_ID ASC_ISSUER_ID; do
            if [ -z "${!v}" ]; then echo "::error::Secret が足りません: $v（docs/SETUP.md 参照）"; exit 1; fi
          done

      - name: Write App Store Connect API key
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$ASC_PRIVATE_KEY" > "$RUNNER_TEMP/keys/AuthKey.p8"
          echo "KEY_PATH=$RUNNER_TEMP/keys/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Remove Family Controls entitlement (UI only build)
        if: ${{ (github.event_name == 'workflow_dispatch' && !inputs.screen_time) || contains(github.ref_name, 'ui-only') }}
        run: |
          for f in mathscreen/mathscreen.entitlements MonitorExtension/MonitorExtension.entitlements \
                   ShieldConfigurationExtension/ShieldConfigurationExtension.entitlements \
                   ShieldActionExtension/ShieldActionExtension.entitlements; do
            /usr/libexec/PlistBuddy -c "Delete :com.apple.developer.family-controls" "$f"
          done

      - name: Install XcodeGen & generate project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project mathscreen.xcodeproj \
            -scheme mathscreen \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/mathscreen.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" | tee archive.log | grep -E "error:|ARCHIVE (SUCCEEDED|FAILED)" || true
          grep -q "ARCHIVE SUCCEEDED" archive.log

      - name: Upload to TestFlight
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/mathscreen.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: "*.log"
