# 手動実行（Actions タブ → TestFlight → Run workflow）で、ビルドして TestFlight にアップロードする。
# 必要な Secrets は docs/SETUP.md を参照。
name: TestFlight

on:
  # コミットメッセージに [testflight] を含めて push すると実行される（標準ブランチに無くても動く）。
  # [ui-only] も含めると、スクリーンタイム機能(Family Controls)を外した版になる。
  push:
    branches: ["claude/**"]
  workflow_dispatch:
    inputs:
      screen_time:
        description: "スクリーンタイム機能(Family Controls)を含める。Apple の配布用許可が下りるまでは false でUIだけ確認"
        type: boolean
        default: true

jobs:
  testflight:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[testflight]') }}
    runs-on: macos-15
    env:
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Use Xcode 26 (Apple requires the iOS 26 SDK for uploads)
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version

      - name: Check secrets
        run: |
          for v in TEAM_ID ASC_KEY_ID ASC_ISSUER_ID; do
            if [ -z "${!v}" ]; then echo "::error::Secret が足りません: $v（docs/SETUP.md 参照）"; exit 1; fi
          done

      - name: Write App Store Connect API key
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$ASC_PRIVATE_KEY" > "$RUNNER_TEMP/keys/AuthKey.p8"
          echo "KEY_PATH=$RUNNER_TEMP/keys/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Remove Family Controls entitlement (UI only build)
        if: ${{ (github.event_name == 'workflow_dispatch' && !inputs.screen_time) || contains(github.event.head_commit.message, '[ui-only]') }}
        run: |
          for f in mathscreen/mathscreen.entitlements MonitorExtension/MonitorExtension.entitlements \
                   ShieldConfigurationExtension/ShieldConfigurationExtension.entitlements \
                   ShieldActionExtension/ShieldActionExtension.entitlements; do
            /usr/libexec/PlistBuddy -c "Delete :com.apple.developer.family-controls" "$f"
          done

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare signing (temporary distribution certificate and profiles)
        # 端末の登録なしで署名するため、配布用の証明書とプロファイルをこの実行の間だけ作る。終わったら下で削除する。
        run: |
          python -m pip install --quiet pyjwt cryptography
          python tools/normalize_key.py
          python tools/ci_signing.py setup

      - name: Install XcodeGen & generate project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project mathscreen.xcodeproj \
            -scheme mathscreen \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/mathscreen.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" | tee archive.log | grep -E "error:|ARCHIVE (SUCCEEDED|FAILED)" || true
          grep -q "ARCHIVE SUCCEEDED" archive.log

      - name: Export IPA
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.ontamaudon.qlock</key><string>QLockCI app</string>
              <key>com.ontamaudon.qlock.monitor</key><string>QLockCI monitor</string>
              <key>com.ontamaudon.qlock.shieldconfig</key><string>QLockCI shieldconfig</string>
              <key>com.ontamaudon.qlock.shieldaction</key><string>QLockCI shieldaction</string>
            </dict>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/mathscreen.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
          ls -la "$RUNNER_TEMP/export"

      - name: Inspect app extensions in the IPA
        # ブロック画面の拡張機能が、正しく組み込まれ、権限が付いているかをログに出す（原因の切り分け）
        run: |
          mkdir -p "$RUNNER_TEMP/ipa" && cd "$RUNNER_TEMP/ipa"
          unzip -q "$RUNNER_TEMP"/export/*.ipa
          APP=$(ls -d Payload/*.app)
          for X in "$APP"/PlugIns/*.appex; do
            echo "=== $X"
            /usr/libexec/PlistBuddy -c "Print :NSExtension" "$X/Info.plist" || true
            codesign -d --entitlements :- "$X" 2>/dev/null | /usr/bin/plutil -p - || true
          done

      - name: Upload to TestFlight
        # Apple ID とアプリ用パスワードの Secret（APPLE_ID, APPLE_APP_PASSWORD）があればそれで送る。
        # なければ API キーで送る（このキーは、アップロードの認証で拒否されることがあった）。
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          IPA=$(ls "$RUNNER_TEMP"/export/*.ipa | head -1)
          if [ -n "$APPLE_ID" ] && [ -n "$APPLE_APP_PASSWORD" ]; then
            echo "Apple ID とアプリ用パスワードで送ります"
            xcrun altool --upload-app -f "$IPA" --type ios \
              --username "$APPLE_ID" --password "@env:APPLE_APP_PASSWORD" 2>&1 | tee upload.log
          else
            echo "API キーで送ります"
            mkdir -p ~/private_keys
            cp "$KEY_PATH" ~/private_keys/AuthKey_${ASC_KEY_ID}.p8
            xcrun altool --upload-app -f "$IPA" --type ios \
              --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" 2>&1 | tee upload.log
          fi
          grep -q "UPLOAD SUCCEEDED" upload.log

      - name: Clean up signing (delete temporary certificate and profiles)
        if: always()
        run: |
          python -m pip install --quiet pyjwt cryptography
          python tools/ci_signing.py cleanup

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: "*.log"
