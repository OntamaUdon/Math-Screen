<title>mathscreen UI Preview</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap">
<style>
/* Layout: one iPhone-sized isometric screen on a quiet stage, demo controls beside it (stacked on phones). */
:root{
  --stage:#E4E7EE; --bg:#EEF1F7; --surface:#FFFFFF; --side:#CBD1E1; --sunken:#E3E7F2; --sunken-side:#C7CCDA; --line:#DDE1EC;
  --ink:#23263A; --ink-soft:#6B7088; --ink-faint:#9AA0B5;
  --teal-light:#7FE0D3; --teal:#3CC5B5; --teal-deep:#26968A;
  --coral-light:#FFB29D; --coral:#FF7A59; --coral-deep:#D2553A;
  --font:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--stage);color:var(--ink);font-family:var(--font);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px}
[hidden]{display:none!important}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible{outline:2px solid var(--teal-deep);outline-offset:3px}
.stage{display:flex;gap:48px;justify-content:center;align-items:flex-start;flex-wrap:wrap;max-width:1040px;margin:0 auto}

.device{width:390px;max-width:100%;height:800px;max-height:calc(100vh - 48px);min-height:640px;border-radius:48px;padding:10px;background:#1C1E2A}
.screen{position:relative;height:100%;border-radius:38px;overflow:hidden;background:var(--bg);
  background-image:linear-gradient(30deg,rgba(35,38,58,.045) 1px,transparent 1px),linear-gradient(150deg,rgba(35,38,58,.045) 1px,transparent 1px);background-size:26px 15px}
.status{display:flex;justify-content:space-between;padding:14px 28px 0;font-size:13px;font-weight:700}
.view{position:absolute;inset:40px 0 76px;overflow-y:auto;padding:8px 20px 24px;scrollbar-width:none}
.view.full{bottom:0}
.view::-webkit-scrollbar{display:none}
.col{display:flex;flex-direction:column;gap:20px}
h1{font-size:27px;font-weight:800;margin:6px 0 0}
.sub{font-size:13.5px;color:var(--ink-soft);margin:2px 0 0}
.label{font-size:12.5px;font-weight:800;color:var(--ink-soft)}
/* slab: diagonal extrusion toward bottom-right */
.card,.list{--top:var(--surface);--sd:var(--side);background:var(--top);border-radius:8px;margin:0 6px 6px 0;
  box-shadow:1px 1px 0 var(--sd),2px 2px 0 var(--sd),3px 3px 0 var(--sd),4px 4px 0 var(--sd),5px 5px 0 var(--sd),6px 6px 0 var(--sd)}
.card{padding:18px}
.card.coral{--top:var(--coral);--sd:var(--coral-deep);color:#fff}
.card.coral .sub{color:rgba(255,255,255,.9)}
.list>*+*{border-top:1px solid var(--line)}
.well{background:var(--surface);border-radius:8px;box-shadow:inset 3px 3px 0 var(--line)}
.row{display:flex;gap:12px;align-items:center}
.btn{--top:var(--teal);--sd:var(--teal-deep);display:block;width:calc(100% - 4px);padding:13px;border-radius:8px;font-size:15.5px;font-weight:800;text-align:center;
  background:var(--top);color:#fff;margin:0 4px 4px 0;transition:transform .08s,box-shadow .08s;
  box-shadow:1px 1px 0 var(--sd),2px 2px 0 var(--sd),3px 3px 0 var(--sd),4px 4px 0 var(--sd)}
.btn.secondary{--top:var(--surface);--sd:var(--sunken-side);color:var(--ink)}
.btn.quiet{--top:var(--sunken);--sd:var(--sunken-side);color:var(--ink)}
.btn:active:not([disabled]){transform:translate(3px,3px);box-shadow:1px 1px 0 var(--sd)}
.btn[disabled]{opacity:.45;cursor:default}
.tag{--top:var(--sunken);--sd:var(--sunken-side);display:inline-block;padding:6px 12px;border-radius:6px;font-size:12.5px;font-weight:800;background:var(--top);color:var(--ink-soft);
  margin:0 2px 2px 0;box-shadow:1px 1px 0 var(--sd),2px 2px 0 var(--sd)}
.tag.on{--top:var(--teal);--sd:var(--teal-deep);color:#fff;box-shadow:1px 1px 0 var(--sd),2px 2px 0 var(--sd),3px 3px 0 var(--sd)}
.textlink{font-size:13px;font-weight:800;color:var(--ink-faint);text-align:center;padding:6px}
.hero svg{display:block;width:100%;height:auto}

.stats3{display:grid;grid-template-columns:repeat(3,1fr)}
.stats3>div{text-align:center}
.stats3>div+div{border-left:1px solid var(--line)}
.stats3 b{display:block;font-size:25px;font-weight:800;font-variant-numeric:tabular-nums}
.stats3 span{font-size:11.5px;color:var(--ink-soft)}
.rule{display:flex;align-items:center;gap:12px;padding:13px 16px}
.rule .meta{flex:1;min-width:0}
.rule .name{font-weight:800;font-size:15.5px}
.rule .desc{font-size:12.5px;color:var(--ink-soft)}
.toggle{width:50px;height:30px;border-radius:15px;position:relative;flex:none;background:var(--side)}
.toggle::after{content:"";position:absolute;top:2px;left:2px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:left .2s}
.toggle[aria-checked="true"]{background:var(--teal)}
.toggle[aria-checked="true"]::after{left:22px}

.tabs{position:absolute;left:0;right:0;bottom:0;height:76px;background:rgba(255,255,255,.96);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(4,1fr);padding:8px 8px 20px}
.tab{font-size:10px;font-weight:800;color:var(--ink-faint);display:flex;flex-direction:column;align-items:center;gap:3px}
.tab svg{width:22px;height:22px}
.tab.on{color:var(--teal-deep)}

.prob{display:flex;flex-direction:column;gap:10px}
.prob .meta{font-size:12.5px;font-weight:800;color:var(--ink-soft)}
.prob .b{font-size:18px;font-weight:500;line-height:1.7}
.prob .h{font-size:11.5px;color:var(--ink-faint)}
.answer{height:66px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;margin-right:6px}
.answer.bad{box-shadow:inset 3px 3px 0 var(--line),0 0 0 2px var(--coral-deep)}
.answer b{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums}
.answer .q{color:var(--ink-faint)}
.wrong{font-size:13px;font-weight:800;color:var(--coral-deep)}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-7px)}50%{transform:translateX(7px)}75%{transform:translateX(-4px)}}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.key{height:50px;font-size:21px;padding:0}
.result{display:flex;flex-direction:column;gap:10px}
.result .ok{font-size:19px;font-weight:800;color:var(--teal-deep)}
.result p{margin:0;line-height:1.75;font-size:14.5px}

.shield{position:absolute;inset:0;z-index:8;background:var(--teal);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:40px 30px;text-align:center}
.shield h2{margin:0;font-size:21px;font-weight:800}
.shield p{margin:0;font-size:13.5px;line-height:1.7;color:var(--ink)}
.shield .q{font-size:14.5px;color:var(--ink);margin-top:6px}
.shield .p1{margin-top:22px;background:var(--sunken);color:var(--ink);border-radius:14px;padding:14px;width:100%;font-weight:800;font-size:16px}
.banner{position:absolute;top:44px;left:12px;right:12px;z-index:9;background:rgba(255,255,255,.97);border:1px solid var(--line);border-radius:18px;
  padding:12px 14px;display:flex;gap:12px;align-items:center;text-align:left;animation:drop .3s ease-out}
@keyframes drop{from{transform:translateY(-110px)}}
.banner .app{width:38px;height:38px;border-radius:9px;background:var(--teal);color:#fff;display:grid;place-items:center;font-weight:800;flex:none}
.banner b{font-size:13.5px;display:block}
.banner span{font-size:12.5px;color:var(--ink-soft)}

.kv{display:flex;justify-content:space-between;padding:13px 16px;font-size:14.5px}
.kv span{color:var(--ink-soft)}
.kv b{font-variant-numeric:tabular-nums}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.foot{font-size:12px;color:var(--ink-soft);margin:6px 2px 0;line-height:1.6}

.side{flex:1 1 300px;max-width:380px;display:flex;flex-direction:column;gap:18px;padding-top:24px}
.side h2{font-size:28px;font-weight:800;margin:0;text-wrap:balance}
.side p{margin:0;line-height:1.75;color:var(--ink-soft);font-size:14.5px}
.side ol{margin:0;padding-left:1.3em;line-height:1.9;font-size:14px}
.note{font-size:12.5px;color:var(--ink-faint)}
@media (max-width:760px){.side{padding-top:0;order:-1}.device{height:760px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="stage">
  <div class="device"><div class="screen" id="screen">
    <div class="status"><span>9:41</span><span>●●● 5G</span></div>
    <div class="view" id="view"></div>
    <nav class="tabs" id="tabs"></nav>
  </div></div>

  <aside class="side">
    <h2>mathscreen の画面プレビュー</h2>
    <p>iOS アプリの見た目と流れを、ブラウザで触って確かめるためのモックです。問題は実際にアプリへ入っている 60 問から出ます。</p>
    <div class="card">
      <span class="label">ロックから解除までの流れ</span>
      <ol>
        <li>下のボタンで「Instagram を 15 分使った」状態にする</li>
        <li>iOS のブロック画面で「問題を解く」</li>
        <li>届いた通知をタップ</li>
        <li>整数で答えて正解すると解除</li>
      </ol>
    </div>
    <button class="btn" id="simulate">Instagram を 15 分使う</button>
    <p class="note">デザイン確認用のページです。本物のアプリの制限はかかりません。</p>
  </aside>
</div>

<script src="problems.js"></script>
<script>
const P = window.PROBLEMS || [];
const CAT = {junior:"中学数学",math1a:"数学I・A",math2b:"数学II・B",math3c:"数学III・C"};
const DIFF = {1:"初級",2:"中級",3:"上級"};
const ICON = {
  home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3.5 11 12 4l8.5 7v9h-5.5v-6h-6v6H3.5z"/></svg>',
  practice:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>',
  stats:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 20v-8M12 20V5M18 20v-5"/></svg>',
  settings:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></svg>'
};
const TABS = [["home","ホーム"],["practice","練習"],["stats","記録"],["settings","設定"]];

const S = {
  tab:"home", locked:false, overlay:null,
  rules:[{id:1,name:"Instagram",min:15,on:true},{id:2,name:"YouTube",min:30,on:true},{id:3,name:"X",min:20,on:false}],
  today:{triggers:2,correct:3,attempts:4}, streak:3, best:7,
  week:[[1,2],[3,3],[0,1],[2,4],[4,3],[1,2],[2,3]],
  cats:new Set(Object.keys(CAT)), diffs:new Set([1,2,3]), required:1,
  practice:{cat:null,diff:null,problem:null},
  solver:null, solvedCount:0
};
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));


/* isometric bar chart (30° projection). Last bar = today, coral. */
function isoChart(values,labels,caption){
  const n=values.length,gap=1.15,span=n*gap+.4,maxBar=2.2,c=Math.cos(Math.PI/6),W=330,H=200;
  const s=Math.min(W/((span+2)*c),(H-24)/((span+1.1)*.5+maxBar+.35));
  const ox=(W-(span+1.9)*c*s)/2+1.5*c*s, oy=H-8-(span+1.1)*.5*s, mx=Math.max(...values,1);
  const P=(x,y,z)=>`${(ox+(x-y)*c*s).toFixed(1)},${(oy+(x+y)*.5*s-z*s).toFixed(1)}`;
  const f=(pts,col)=>`<polygon points="${pts.map(p=>P(...p)).join(" ")}" fill="${col}"/>`;
  const box=(x,y,z,w,d,h,t,l,r)=>f([[x,y+d,z],[x+w,y+d,z],[x+w,y+d,z+h],[x,y+d,z+h]],l)+f([[x+w,y,z],[x+w,y+d,z],[x+w,y+d,z+h],[x+w,y,z+h]],r)+f([[x,y,z+h],[x+w,y,z+h],[x+w,y+d,z+h],[x,y+d,z+h]],t);
  let g=box(-.2,-.6,0,span,1.6,.25,"#FFFFFF","#DDE1EC","#C7CCDA");
  values.forEach((v,i)=>{const today=i===n-1,h=Math.max(.12,v/mx*maxBar);
    g+=box(i*gap+.1,-.3,.25,.8,.8,h,today?"#FFB29D":"#7FE0D3",today?"#FF7A59":"#3CC5B5",today?"#D2553A":"#26968A");
    const [lx,ly]=P(i*gap+.5,1.3,0).split(",");g+=`<text x="${lx}" y="${+ly+4}" text-anchor="middle" font-size="10" font-weight="800" fill="#6B7088">${labels[i]}</text>`;});
  const last=values[n-1],[tx,ty]=P((n-1)*gap+.5,.1,.25+Math.max(.12,last/mx*maxBar)).split(",");
  g+=`<text x="${tx}" y="${+ty-8}" text-anchor="middle" font-size="11" font-weight="800" fill="#23263A">今日 ${last}</text>`;
  return `<div class="hero"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${caption}">${g}</svg><span class="label">${caption}</span></div>`;
}
const DAYS=["月","火","水","木","金","土","日"];

function pick(cats,diffs,exclude){
  let pool = P.filter(p=>cats.has(p.category)&&diffs.has(p.difficulty)&&p.id!==exclude);
  if(!pool.length) pool = P;
  return pool[Math.floor(Math.random()*pool.length)];
}

function homeView(){
  const t=S.today;
  return `<div class="col">
    <h1>mathscreen</h1>
    ${isoChart(S.week.map(w=>w[1]),DAYS,"この7日間の正解数")}
    ${S.locked?`<div class="card coral col" style="gap:10px">
      <b style="font-size:16px">制限中</b>
      <span class="sub">Instagram がロックされています。</span>
      <button class="btn secondary" data-act="challenge">問題を解く</button></div>`:""}
    <div class="card col" style="gap:12px"><span class="label">今日</span>
      <div class="stats3"><div><b>${t.triggers}</b><span>発動</span></div><div><b>${t.correct}</b><span>正解</span></div><div><b>${S.streak}</b><span>連続正解</span></div></div></div>
    <div class="col" style="gap:10px">
      <div class="row" style="justify-content:space-between"><b style="font-size:17px">見守るアプリ</b><button style="color:var(--teal-deep);font-weight:800;font-size:14px">＋ 追加</button></div>
      <div class="list">${S.rules.map(r=>`<div class="rule"><div class="meta"><div class="name">${r.name}${S.locked&&r.id===1?' <span style="color:var(--coral-deep);font-size:12px">●制限中</span>':""}</div><div class="desc">1件 ・ ${r.min}分ごと</div></div>
        <button class="toggle" role="switch" aria-label="${r.name}" aria-checked="${r.on}" data-rule="${r.id}"></button></div>`).join("")}</div>
    </div>
  </div>`;
}

function solverHTML(ctx){
  const v=S.solver, p=v.problem;
  const top=`<div class="card prob"><div class="meta">${CAT[p.category]} ・ ${DIFF[p.difficulty]} ・ ${esc(p.title)}</div><div class="b">${esc(p.body)}</div><div class="h">答えは整数で入力</div></div>`;
  if(v.solved){
    const last = ctx==="challenge" && S.solvedCount>=S.required;
    const label = ctx==="challenge"&&last ? "解除してアプリに戻る" : "次の問題へ";
    return top+`<div class="card result"><div class="ok">✓ 正解　答えは ${p.answer}</div><span class="label">解説</span><p>${esc(p.explanation)}</p>
      <button class="btn" data-act="${last?"finish":"next"}">${label}</button></div>`;
  }
  const keys=["7","8","9","4","5","6","1","2","3","±","0","⌫"];
  return top+`<div class="well answer ${v.wrong?"bad":""} ${v.shake?"shake":""}"><b class="${v.input?"":"q"}">${v.input?esc(v.input.replace("-","−")):"?"}</b>${v.wrong?'<span class="wrong">不正解</span>':""}</div>
    <div class="pad">${keys.map(k=>`<button class="btn key ${k==="±"||k==="⌫"?"quiet":"secondary"}" data-key="${k}">${k}</button>`).join("")}</div>
    <button class="btn" data-act="submit" ${/^-?\d+$/.test(v.input)?"":"disabled"}>こたえる</button>
    ${v.attempts>=3?'<button class="textlink" data-act="skip">別の問題にする</button>':""}`;
}

function challengeView(){
  return `<div class="col" style="gap:16px">
    <div class="row" style="justify-content:space-between;align-items:flex-start">
      <div><h1 style="font-size:23px">1問解いて再開</h1><p class="sub">Instagram ・ 正解 ${S.solvedCount} / ${S.required}</p></div>
      <button class="btn quiet" style="width:36px;height:36px;padding:0;font-size:13px" data-act="close" aria-label="閉じる">✕</button>
    </div>
    ${solverHTML("challenge")}
    <button class="textlink" data-act="emergency">緊急解除</button>
  </div>`;
}

function practiceView(){
  const pr=S.practice;
  const head=`<div><h1>練習</h1><p class="sub">${P.length} 問から自由に挑戦</p></div>`;
  if(S.solver && pr.problem) return `<div class="col" style="gap:16px">${head}${solverHTML("practice")}<button class="textlink" data-act="filters">条件を変える</button></div>`;
  const tags=(items,cur,key)=>`<div style="display:flex;flex-wrap:wrap;gap:8px">${items.map(([v,l])=>`<button class="tag ${cur===v?"on":""}" data-${key}="${v??""}">${l}</button>`).join("")}</div>`;
  return `<div class="col">${head}
    <div class="card col" style="gap:14px">
      <span class="label">分野</span>${tags([[null,"すべて"],...Object.entries(CAT)],pr.cat,"cat")}
      <span class="label">難易度</span>${tags([[null,"すべて"],[1,"初級"],[2,"中級"],[3,"上級"]],pr.diff,"diff")}
      <button class="btn" data-act="start">はじめる</button>
    </div></div>`;
}

function statsView(){
  const t=S.today, acc=Math.round((38+t.correct)/Math.max(1,46+t.attempts)*100);
    const kv=(k,v)=>`<div class="kv"><span>${k}</span><b>${v}</b></div>`;
  return `<div class="col"><h1>記録</h1>
    <div class="list">${kv("制限の発動","18 回")}${kv("累計正解",(38+t.correct)+" 問")}${kv("正答率",acc+" %")}${kv("連続正解日数","5 日")}${kv("いまの連続正解",S.streak+" 問")}${kv("最高連続正解",S.best+" 問")}</div>
    <div class="card"><b style="font-size:15px">この7日間</b>${isoChart(S.week.map(w=>w[1]),DAYS,"正解数（コーラルが今日）")}<p class="foot">発動 ${S.week.reduce((t,w)=>t+w[0],0)} 回 ・ 正解 ${S.week.reduce((t,w)=>t+w[1],0)} 問</p></div>
    <div class="list">${kv("問題で解除した回数","12 回")}${kv("緊急解除した回数","1 回")}</div></div>`;
}

function settingsView(){
  const cnt=P.filter(p=>S.cats.has(p.category)&&S.diffs.has(p.difficulty)).length;
  const row=(label,on,attr)=>`<div class="rule"><div class="meta" style="font-size:15px">${label}</div><button class="toggle" role="switch" aria-label="${label}" aria-checked="${on}" ${attr}></button></div>`;
  return `<div class="col"><h1>設定</h1>
    <div><span class="label">出題する分野</span><div class="list" style="margin-top:8px">${Object.entries(CAT).map(([k,l])=>row(l,S.cats.has(k),`data-setcat="${k}"`)).join("")}</div></div>
    <div><span class="label">難易度</span><div class="list" style="margin-top:8px">${[1,2,3].map(d=>row(DIFF[d],S.diffs.has(d),`data-setdiff="${d}"`)).join("")}</div><p class="foot">出題対象：${cnt} 問</p></div>
    <div><span class="label">解除に必要な正解数</span><div class="seg" style="margin-top:8px">${[1,2,3].map(n=>`<button class="tag ${S.required===n?"on":""}" data-req="${n}">${n}問</button>`).join("")}</div></div>
    <div><span class="label">もしものとき</span><div class="list" style="margin-top:8px"><button class="kv" style="width:100%;color:${S.locked?"var(--danger)":"var(--ink-faint)"};font-weight:700" data-act="emergency" ${S.locked?"":"disabled"}>緊急解除</button></div>
      <p class="foot">制限中でも電話・メッセージなど iOS の基本機能は使えます。どうしても必要なときは、問題を解かずに解除できます（記録に残ります）。</p></div>
  </div>`;
}

function render(){
  $("#tabs").innerHTML = TABS.map(([k,l])=>`<button class="tab ${S.tab===k?"on":""}" data-tab="${k}">${ICON[k]}${l}</button>`).join("");
  const v=$("#view"), full=S.overlay==="challenge";
  v.innerHTML = full ? challengeView() : ({home:homeView,practice:practiceView,stats:statsView,settings:settingsView})[S.tab]();
  v.classList.toggle("full",full);
  $("#tabs").hidden = full;
  document.querySelectorAll(".shield,.banner").forEach(e=>e.remove());
  if(S.overlay==="shield"){
    $("#screen").insertAdjacentHTML("beforeend",`<div class="shield"><h2>1問解いて再開</h2>
      <p>Instagram の時間になりました</p><p class="q">${esc(S.pending.body)}</p>
      <button class="p1" data-act="shieldSolve">問題を解く</button></div>`);
  }
  if(S.overlay==="banner"){
    $("#screen").insertAdjacentHTML("beforeend",`<button class="banner" data-act="openNotif"><span class="app">√</span><span><b>mathscreen：問題が届きました</b><span>タップして問題を解こう。正解すると再開できます。</span></span></button>`);
  }
}

function newSolver(problem){ S.solver={problem,input:"",attempts:0,wrong:false,solved:false,shake:false}; }
function openChallenge(){ S.overlay="challenge"; S.solvedCount=0; newSolver(S.pending||pick(S.cats,S.diffs)); $("#view").scrollTop=0; }
function practiceCats(){ return S.practice.cat?new Set([S.practice.cat]):new Set(Object.keys(CAT)); }
function practiceDiffs(){ return S.practice.diff?new Set([S.practice.diff]):new Set([1,2,3]); }

document.addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  const d=b.dataset;
  if(b.id==="simulate"){ S.pending=pick(S.cats,S.diffs); S.locked=true; S.today.triggers++; S.tab="home"; S.overlay="shield"; }
  else if(d.tab){ S.tab=d.tab; S.overlay=null; if(d.tab!=="practice"){ S.practice.problem=null; S.solver=null; } }
  else if(d.rule){ const r=S.rules.find(r=>r.id==d.rule); r.on=!r.on; }
  else if(d.key!==undefined && S.solver){
    const v=S.solver; v.shake=false;
    if(d.key==="⌫") v.input=v.input.slice(0,-1);
    else if(d.key==="±") v.input=v.input.startsWith("-")?v.input.slice(1):"-"+v.input;
    else if(v.input.replace("-","").length<9) v.input=(v.input==="0"?"":v.input==="-0"?"-":v.input)+d.key;
  }
  else if(d.cat!==undefined){ S.practice.cat=d.cat||null; }
  else if(d.diff!==undefined){ S.practice.diff=d.diff?+d.diff:null; }
  else if(d.setcat){ const s=S.cats; s.has(d.setcat)?(s.size>1&&s.delete(d.setcat)):s.add(d.setcat); }
  else if(d.setdiff){ const s=S.diffs,n=+d.setdiff; s.has(n)?(s.size>1&&s.delete(n)):s.add(n); }
  else if(d.req){ S.required=+d.req; }
  else switch(d.act){
    case "submit":{ const v=S.solver; v.attempts++; S.today.attempts++;
      if(+v.input===v.problem.answer){ v.solved=true; v.wrong=false; S.today.correct++; S.streak++; S.best=Math.max(S.best,S.streak); if(S.overlay==="challenge") S.solvedCount++; }
      else { v.wrong=true; v.shake=true; v.input=""; S.streak=0; } break; }
    case "skip":{ const ch=S.overlay==="challenge"; newSolver(pick(ch?S.cats:practiceCats(),ch?S.diffs:practiceDiffs(),S.solver.problem.id)); if(!ch) S.practice.problem=S.solver.problem; break; }
    case "next":
      if(S.overlay==="challenge") newSolver(pick(S.cats,S.diffs,S.solver.problem.id));
      else { S.practice.problem=pick(practiceCats(),practiceDiffs(),S.practice.problem?.id); newSolver(S.practice.problem); }
      $("#view").scrollTop=0; break;
    case "start": S.practice.problem=pick(practiceCats(),practiceDiffs()); newSolver(S.practice.problem); break;
    case "filters": S.practice.problem=null; S.solver=null; break;
    case "challenge": case "openNotif": openChallenge(); break;
    case "finish": case "emergency": S.locked=false; S.overlay=null; S.tab="home"; break;
    case "close": case "shieldClose": S.overlay=null; break;
    case "shieldSolve": S.overlay="banner"; break;
  }
  render();
});
render();
</script>
