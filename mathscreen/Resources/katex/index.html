<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="stylesheet" href="katex.min.css">
<style>
  html, body { margin: 0; padding: 0; background: transparent; -webkit-text-size-adjust: 100%; }
  #m { font-family: -apple-system, "Hiragino Sans", sans-serif; font-weight: 500; line-height: 1.75;
       line-break: strict; word-break: normal; overflow-wrap: anywhere; padding: 1px 0 3px; }
  .katex { font-size: 1.08em; }
  .katex-display { margin: .5em 0; }
</style>
</head>
<body>
<div id="m"></div>
<script src="katex.min.js"></script>
<script src="auto-render.min.js"></script>
<script>
  var el = document.getElementById('m');
  function report() {
    var h = Math.ceil(el.getBoundingClientRect().height);
    window.webkit.messageHandlers.height.postMessage(h);
  }
  // src: LaTeX 混じりの文（$...$ が数式）。size: px。color: CSS 色。
  function render(src, size, color) {
    el.style.fontSize = size + 'px';
    el.style.color = color;
    el.textContent = src;
    renderMathInElement(el, {
      delimiters: [{left: '$$', right: '$$', display: true}, {left: '$', right: '$', display: false}],
      throwOnError: false
    });
    report();
  }
  new ResizeObserver(report).observe(el);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(report);
</script>
</body>
</html>
